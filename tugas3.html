<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 3</title>
    <link rel="stylesheet" href="./form.css">
</head>

<body>

<div class="main">
    <h1>Kalkulator Sederhana</h1>

    <form class="kalkulator">

        <div>
            <label>Input bilangan 1</label>
            <input type="number" id="bil1" placeholder="Masukkan angka">
        </div>

        <div>
            <label>Input bilangan 2</label>
            <input type="number" id="bil2" placeholder="Masukkan angka">
        </div>

        <div class="buttons">
            <button onclick="hitung(event, '+')">+</button>
            <button onclick="hitung(event, '-')">−</button>
            <button onclick="hitung(event, '/')">÷</button>
            <button onclick="hitung(event, '*')">×</button>
        </div>

        <div>
            <label>Hasil</label>
            <input type="text" id="output" disabled>
        </div>

    </form>
</div>

<script>
function hitung(event, operator) {
    event.preventDefault();

    let a = Number(document.getElementById("bil1").value);
    let b = Number(document.getElementById("bil2").value);
    let hasil;

    if (operator == "+") hasil = a + b;
    else if (operator == "-") hasil = a - b;
    else if (operator == "/") hasil = a / b;
    else hasil = a * b;

    document.getElementById("output").value = hasil;
}
</script>

</body>
</html>
